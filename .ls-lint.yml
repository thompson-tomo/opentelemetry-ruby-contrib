ls:
  "{helpers,instrumentation,processor,propagator,resources,sampler}":
    .dir: snake_case
    "*":
      .: regex:(Appraisals|Gemfile|LICENSE|Rakefile) | exists:4
      .gemspec: regex:(opentelemetry-${0}-${1}) | exists:1
      .md: regex:(CHANGELOG|README) | exists:2
      .rubocop.yml: exists:1
      .yardopts: exists:1
      .dir: regex:(example|lib|test)
      example:
        .dir: snake_case
      lib:
        .dir: snake_case
      test:
        .dir: snake_case

ignore:
  - .git
  - node_modules